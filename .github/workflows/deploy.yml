name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  # Rebuild the artifact index daily, so new IG versions and CI builds show up
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install mkdocs-material

      # The artifact index across all IGs (docs/artifacts/artifacts-data.json)
      - run: python scripts/build_artifacts_index.py

      - run: mkdocs gh-deploy --force
